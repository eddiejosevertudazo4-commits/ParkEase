      <stop offset="1" stop-color="#0a4a87"/>

  </defs>

<div class="bg" id="bg">
  <svg class="wv" viewBox="0 0 1200 120" preserveAspectRatio="none">
    <path fill="rgba(255,255,255,.1)" d="M0 60Q150 10 300 60T600 60T900 60T1200 60V120H0Z"/>
  </svg>
  <svg class="wv b" viewBox="0 0 1200 120" preserveAspectRatio="none">
    <path fill="rgba(147,197,253,.14)" d="M0 50Q150 100 300 50T600 50T900 50T1200 50V120H0Z"/>
  </svg>
</div>
<nav class="glass">
  <div class="brand">
    <svg class="logo">
      <use href="#logo"/>
    </svg><span class="wm"><span>Park<b>Ease</b></span><small>SMART PARKING</small></span></div>
  <a href="#dashboard" data-p="dashboard">Dashboard</a>
  <a href="#entry" data-p="entry">Registry Entry</a>
  <a href="#history" data-p="history">Parking History</a>
  <a href="#payments" data-p="payments">Payments</a>
  <a href="#about" data-p="about">About Us</a><span class="clock"><span class="live"></span><span id="clk"></span></span><button id="ac" onclick="acct()" aria-label="Account">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0116 0"/>
    </svg>
  </button>
  <button id="th" onclick="theme()" aria-label="Toggle theme"></button>
  <button id="bell" onclick="togN()" aria-label="Notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 00-6 6v4l-2 3h16l-2-3V9a6 6 0 00-6-6zM10 19a2 2 0 004 0"/>
    </svg><span class="c" id="nc" hidden>0</span></button>
  <button id="lo" onclick="logout()">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
    </svg>Log Out</button>
</nav>
<div id="np" class="glass"></div>
<div id="wl" hidden>
  <div class="glass wp" id="wp">
    <svg class="logo">
      <use href="#logo"/>
    </svg>
    <h1 id="wh" style="--i:1">Park<b>Ease</b></h1>
    <div class="tg" style="--i:2">SMART PARKING MANAGEMENT SYSTEM</div>
    <div class="wg" id="wg" style="--i:3"></div>
    <div class="wd" id="wd" style="--i:3"></div>
    <div class="wr" id="wr" style="--i:3"></div>
    <div class="wa" id="wa" style="--i:4"></div>
    <div class="wbt" style="--i:5">
      <button class="b" onclick="authOpen('in')">Log In</button>
      <button class="b gh" onclick="authOpen('up')">Sign Up</button>
    </div>
    <p class="mu" style="font-size:.75rem;margin:14px 0 0;--i:6">Click anywhere to send a vehicle across the screen</p>
  </div>
  <div class="mo" id="aum" hidden onclick="if(event.target===this)authClose()">
    <div class="slip glass">
      <div id="au"></div>
    </div>
  </div>
  <div class="wroad" id="wrd"></div>
</div>
<main id="v"></main>
<div id="t"></div>
<div id="md"></div>

<script src="app.js"></script>
</body>
</html>
